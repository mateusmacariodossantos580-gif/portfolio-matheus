<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-center">
        <section class="form-box">
            <p class="section-label">Acesso ao sistema</p>
            <h1>Fazer login</h1>
            <form>
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required>

                <button type="submit" class="primary-button">Entrar</button>
            </form>

            <p class="switch-link">
                Ainda não tem cadastro?
                <a href="cadastro.html" data-replace="cadastro">Cadastrar-se</a>
            </p>
        </section>
    </main>

    <script>
        const cadastroLink = document.querySelector('[data-replace="cadastro"]');

        cadastroLink.addEventListener('click', (event) => {
            event.preventDefault();
            window.location.replace('cadastro.html');
        });
    </script>
</body>
</html>
